name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (host + webview)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (extension + webview)
        run: npm run build

  # Non-blocking canary: re-installs the FLOATING @beta client over the pin
  # and runs the gates. If upstream beta drift breaks our surface, this job
  # goes red early — before end users hit it — and the fix lands in
  # apiAdapter.ts.
  beta-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floating @beta client
        run: npm install --no-save @opencode-ai/client@beta
      - name: Typecheck against latest beta
        run: npm run typecheck
      - name: Build against latest beta
        run: npm run build

  # End-to-end drift detection: boots a REAL headless server from the latest
  # published beta CLI and runs the full live smoke suite against it. This
  # catches runtime/API drift that type-level checks cannot see.
  integration-beta:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install latest beta CLI (provides `opencode`)
        run: npm install -g opencode-ai@beta
      - name: Boot headless beta server
        run: |
          opencode serve --hostname 127.0.0.1 --port 18100 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:18100/api/health >/dev/null 2>&1; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18100/api/health >/dev/null 2>&1 || {
            echo "::error::beta server failed to become healthy on :18100"
            exit 1
          }
      - name: Live smoke against beta server
        env:
          OPENCODE_BASE_URL: http://127.0.0.1:18100
        run: node scripts/smoke.mjs

  # Tag-driven release: gates first, then GitHub Release with the vsix +
  # auto-generated notes, then (when the VSCE_PAT secret is configured)
  # publish to the VS Code Marketplace.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build + package vsix
        run: |
          npm run build
          # Versioned name keeps release assets unique & pretty; without this,
          # manually-attached builds and CI builds would collide as duplicates.
          npx --yes @vscode/vsce package --no-git-tag-version -o "opencode2-vscode-gui-${GITHUB_REF_NAME#v}.vsix"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: opencode2-vscode-gui-*.vsix
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish