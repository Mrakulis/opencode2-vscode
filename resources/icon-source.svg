<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenCode 2">
  <title>OpenCode 2 — Cell + Cursor</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Backplate: rounded square, own dark -->
  <rect width="1024" height="1024" rx="192" fill="#17171c"/>
  <rect width="1024" height="1024" rx="192" fill="url(#glow)"/>
  <!-- Cell + Cursor: hexagon filled violet, chevron + caret in white -->
  <g filter="url(#shadow)">
    <path d="M512 168 L803 336 L803 688 L512 856 L221 688 L221 336 Z" fill="#7c5cff" stroke="#6d47f0" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <!-- Chevron >  -->
  <path d="M 448 410 L 608 512 L 448 614" fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/>
  <!-- Caret block — streaming motif from Feed.tsx -->
  <rect x="614" y="452" width="30" height="118" rx="8" fill="white" opacity="0.95"/>
</svg>
